# Local development only. Synthetic data only — never load real patient data.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swasthyaiq
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: swasthyaiq
    ports:
      - '5432:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
