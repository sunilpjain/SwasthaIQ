# /opt/swasthyaiq/docker-compose.yml on the app server. Values come from /opt/swasthyaiq/.env,
# which user data writes from stack outputs (no secrets: the API reads those from Secrets Manager).
services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    expose:
      - '3000'
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: api
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
