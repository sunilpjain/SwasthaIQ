# DIG-35 — continuous deployment.
#   push to main  -> dev  (after ci passes)
#   tag v*        -> demo (only after 10 pm IST; the doctors' environment changes only on purpose)
# AWS access is through GitHub OIDC roles created by the SwasthyaIQ-Account stack (no long-lived keys).
# Repository variable required: AWS_ACCOUNT_ID.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Roll the dev server back to the previous image'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'demo' || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
      TARGET: ${{ github.event_name == 'push' && 'demo' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Demo deploys only after 10 pm IST
        if: env.TARGET == 'demo'
        run: |
          hour=$(TZ=Asia/Kolkata date +%H)
          if [ "$hour" -lt 22 ]; then
            echo "::error::Demo deploys run after 22:00 IST (now ${hour}:xx). Re-run this job after 10 pm."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/swasthyaiq-github-deploy-${{ env.TARGET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          echo "instance=$(out SwasthyaIQ-${TARGET}-Server InstanceId)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(out SwasthyaIQ-${TARGET}-Web SiteBucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(out SwasthyaIQ-${TARGET}-Web DistributionId)" >> "$GITHUB_OUTPUT"

      - name: Image tag
        id: tag
        run: |
          if [ "$TARGET" = "demo" ]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=dev-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"; fi

      - name: Build and push API image (arm64)
        if: ${{ !inputs.rollback }}
        run: |
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker buildx create --use
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          image="$registry/swasthyaiq-api:${{ steps.tag.outputs.tag }}"
          if aws ecr describe-images --repository-name swasthyaiq-api --image-ids imageTag=${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
            echo "image already exists: $image"
          else
            docker buildx build --platform linux/arm64 -f api/Dockerfile \
              --build-arg APP_VERSION=${{ steps.tag.outputs.tag }} -t "$image" --push .
          fi

      - name: Deploy API on the server (via SSM; migrations run on start)
        run: |
          arg="${{ inputs.rollback && '--rollback' || steps.tag.outputs.tag }}"
          id=$(aws ssm send-command --instance-ids "${{ steps.stack.outputs.instance }}" \
            --document-name AWS-RunShellScript --comment "deploy $arg" \
            --parameters "commands=[\"/opt/swasthyaiq/deploy.sh $arg\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "${{ steps.stack.outputs.instance }}" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "${{ steps.stack.outputs.instance }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "${{ steps.stack.outputs.instance }}" --query Status --output text)
          test "$status" = "Success"

      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.rollback }}
      - uses: actions/setup-node@v4
        if: ${{ !inputs.rollback }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Publish admin web
        if: ${{ !inputs.rollback }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @swasthyaiq/shared build
          pnpm --filter admin-web build
          aws s3 sync admin-web/dist/ "s3://${{ steps.stack.outputs.bucket }}/" --delete
          aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution }}" --paths '/admin/*' >/dev/null
